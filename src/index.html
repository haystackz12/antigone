<!DOCTYPE html>
<html lang="en" data-theme="light" data-panel="split">
<!--
  Antigone — index.html
  Option D layout: icon rail | editor | preview | right panel
  Scripts injected by webpack HtmlWebpackPlugin — do not add manual <script> tags.
-->
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 font-src 'self';
                 img-src 'self' data: blob:;
                 connect-src 'self' ws://localhost:*;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antigone</title>
</head>

<body>

  <!-- ── Titlebar ─────────────────────────────────────────────────────────── -->
  <div id="titlebar">
    <div id="titlebar-left"></div>
    <div id="titlebar-center">Antigone</div>

    <div id="titlebar-right">
      <button class="toolbar-btn" id="btn-theme" data-tooltip="Toggle Theme" aria-label="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" id="icon-theme-sun">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.25"/>
          <line x1="8" y1="1.5" x2="8" y2="3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="8" y1="13" x2="8" y2="14.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="1.5" y1="8" x2="3" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="13" y1="8" x2="14.5" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" id="icon-theme-moon" style="display:none">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="word-goal-ring" data-tooltip="Set Word Goal (⌘⇧G)" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle class="goal-track" cx="11" cy="11" r="8" fill="none"/>
          <circle class="goal-progress" cx="11" cy="11" r="8" fill="none" id="goal-arc"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ── Format strip ─────────────────────────────────────────────────────── -->
  <div id="format-strip">
    <div class="fmt-group" id="toolbar-view-toggles">
      <button id="btn-view-editor" class="fmt-btn" data-view="editor" data-tooltip="Editor Only" aria-label="Editor only">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/><line x1="5" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="5" y1="11" x2="9" y2="11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-view-split" class="fmt-btn" data-view="split" data-tooltip="Split View" aria-label="Split view">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.25"/></svg>
      </button>
      <button id="btn-view-preview" class="fmt-btn" data-view="preview" data-tooltip="Preview Only" aria-label="Preview only">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/><line x1="5" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="5" y1="11" x2="11" y2="11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="fmt-sep"></div>
    <div class="fmt-group">
      <button id="btn-bold" class="fmt-btn tooltip-below" data-action="bold" data-tooltip="Bold (⌘B)" aria-label="Bold"><b>B</b></button>
      <button id="btn-italic" class="fmt-btn tooltip-below" data-action="italic" data-tooltip="Italic (⌘I)" aria-label="Italic"><i>I</i></button>
      <button id="btn-underline" class="fmt-btn tooltip-below" data-tooltip="Underline" aria-label="Underline"><u>U</u></button>
      <button id="btn-strike" class="fmt-btn tooltip-below" data-action="strike" data-tooltip="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
      <button id="btn-highlight" class="fmt-btn tooltip-below" data-tooltip="Highlight (==)" aria-label="Highlight"><mark>H</mark></button>
    </div>
    <div class="fmt-group">
      <button id="btn-code" class="fmt-btn tooltip-below" data-action="code" data-tooltip="Inline Code" aria-label="Inline code"><code>`</code></button>
      <button id="btn-link" class="fmt-btn tooltip-below" data-action="link" data-tooltip="Insert Link (⌘K)" aria-label="Insert link">⎔</button>
      <button id="btn-blockquote" class="fmt-btn tooltip-below" data-tooltip="Blockquote" aria-label="Blockquote">&gt;</button>
    </div>
    <div class="fmt-group">
      <button id="btn-h1" class="fmt-btn tooltip-below" data-action="h1" data-tooltip="Heading 1" aria-label="Heading 1">H1</button>
      <button id="btn-h2" class="fmt-btn tooltip-below" data-action="h2" data-tooltip="Heading 2" aria-label="Heading 2">H2</button>
      <button id="btn-h3" class="fmt-btn tooltip-below" data-action="h3" data-tooltip="Heading 3" aria-label="Heading 3">H3</button>
    </div>
    <div id="fmt-spacer"></div>
    <button id="btn-tags-toggle" class="fmt-btn fmt-tags tooltip-below" data-tooltip="Toggle Tags Panel" aria-label="Toggle tags">
      Tags <span id="fmt-tag-count" class="fmt-badge" hidden>0</span>
    </button>
  </div>

  <!-- ── Tab bar ──────────────────────────────────────────────────────────── -->
  <div id="tabbar" role="tablist" aria-label="Open files">
    <button id="btn-new-tab" class="tab-new" aria-label="New file" title="New file (⌘N)">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ── Main workspace ───────────────────────────────────────────────────── -->
  <div id="workspace">

    <!-- Icon rail -->
    <div id="icon-rail">
      <button id="rail-focus" class="rail-btn" data-tooltip="Focus Mode (⌘⇧F)" data-panel="none" aria-label="Toggle focus mode">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.25"/>
          <path d="M2 2h3M2 2v3M14 2h-3M14 2v3M2 14h3M2 14v-3M14 14h-3M14 14v-3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="rail-tags" class="rail-btn" data-tooltip="Tags" data-panel="tags-panel" aria-label="Tags panel">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8.5 8.5 2H14v5.5L7.5 14 2 8.5Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
          <circle cx="11" cy="5" r="1" fill="currentColor"/>
        </svg>
      </button>
      <button id="rail-toc" class="rail-btn" data-tooltip="Table of Contents" data-panel="toc-panel" aria-label="Table of contents panel">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="3" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="5" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="5" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="3" y1="13" x2="13" y2="13" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Editor pane -->
    <main id="editor-pane" role="main">
      <div id="large-file-banner" hidden role="alert">
        <span>Large file — inline rendering disabled for performance.</span>
      </div>
      <div id="recovery-banner" hidden>
        <span>Unsaved work found from a previous session.</span>
        <button id="btn-restore-recovery">Restore</button>
        <button id="btn-dismiss-recovery">Dismiss</button>
      </div>
      <div id="empty-state" aria-label="Welcome screen">
        <div class="empty-state-inner">
          <div class="empty-logo" aria-hidden="true">A</div>
          <h1 class="empty-title">Antigone</h1>
          <p class="empty-subtitle">A writing environment for long-form Markdown</p>
          <div class="empty-actions">
            <button class="empty-btn empty-btn--primary" id="btn-open-file">Open file <kbd>⌘O</kbd></button>
            <button class="empty-btn" id="btn-new-file">New file <kbd>⌘N</kbd></button>
          </div>
          <p class="empty-hint">Or drop a .md file anywhere in this window</p>
        </div>
      </div>
      <div id="cm-editor" aria-label="Markdown editor"></div>
    </main>

    <!-- Split resize gutter -->
    <div id="split-resize" aria-hidden="true" title="Drag to resize"></div>

    <!-- Preview pane -->
    <aside id="preview-pane" aria-label="Markdown preview">
      <div id="preview-content" class="prose"></div>
      <div id="preview-placeholder"><p>Live preview</p></div>
    </aside>

    <!-- Right panel — opened by icon rail -->
    <div id="right-panel" hidden>
      <div id="tags-panel" class="panel-section">
        <div class="panel-header">
          <span class="panel-title">TAGS</span>
          <button class="panel-close" aria-label="Close panel">&times;</button>
        </div>
        <div id="tag-list"></div>
      </div>
      <div id="toc-panel" class="panel-section" hidden>
        <div class="panel-header">
          <span class="panel-title">CONTENTS</span>
          <button class="panel-close" aria-label="Close panel">&times;</button>
        </div>
        <div id="toc-list"></div>
      </div>
    </div>

  </div>

  <!-- ── Status bar ───────────────────────────────────────────────────────── -->
  <footer id="statusbar" role="status" aria-live="polite">
    <div class="status-left">
      <span class="status-item" id="status-lang" title="File type">MD</span>
    </div>
    <div class="status-center">
      <span class="status-item" id="status-words">0 words</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span class="status-item" id="status-readtime">0 min</span>
    </div>
    <div class="status-right">
      <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span class="status-item status-save" id="status-save" data-state="saved">Saved ✓</span>
      <span id="saved-indicator" class="saved-fade"></span>
    </div>
  </footer>

  <div id="focus-overlay" aria-hidden="true" hidden></div>

</body>
</html>
