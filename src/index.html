<!DOCTYPE html>
<html lang="en" data-theme="light" data-panel="split">
<!--
  Antigone — index.html
  Three-panel shell: #sidebar | #editor-pane | #preview-pane
  Scripts injected by webpack HtmlWebpackPlugin — do not add manual <script> tags.
  All renderer modules loaded via src/renderer.js entry point.
-->
<head>
  <meta charset="UTF-8" />
  <!-- Block all external resource loads — CSP enforces local-only. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 font-src 'self';
                 img-src 'self' data: blob:;
                 connect-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antigone</title>
</head>

<body>

  <!-- ── Traffic-light drag region (macOS hiddenInset titleBarStyle) ───────── -->
  <!-- This bar is -webkit-app-region: drag. Interactive children must opt out. -->
  <div id="titlebar" aria-hidden="true">
    <!-- Traffic light gutter: 72px reserved for macOS buttons -->
    <div id="titlebar-traffic-gutter"></div>

    <!-- Document title — updated by tabs.js -->
    <div id="titlebar-title" class="titlebar-title">Antigone</div>

    <!-- Toolbar actions — right-aligned -->
    <div id="toolbar" role="toolbar" aria-label="Formatting toolbar">

      <!-- View mode toggles -->
      <div class="toolbar-group" id="toolbar-view-toggles" role="group" aria-label="View mode">
        <button class="toolbar-btn" id="btn-view-editor"  data-view="editor"  title="Editor only (⌘1)" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
            <line x1="5" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="11" x2="9"  y2="11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-view-split"   data-view="split"   title="Split view (⌘2)" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
            <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.25"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-view-preview" data-view="preview" title="Preview only (⌘3)" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
            <line x1="5" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="11" x2="11" y2="11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="toolbar-separator" aria-hidden="true"></div>

      <!-- Formatting — inline (Day 3+ wired, stubs present now) -->
      <div class="toolbar-group toolbar-format" role="group" aria-label="Text formatting">
        <button class="toolbar-btn" id="btn-bold"         title="Bold (⌘B)"          data-action="bold">          <b>B</b></button>
        <button class="toolbar-btn" id="btn-italic"       title="Italic (⌘I)"        data-action="italic">        <i>I</i></button>
        <button class="toolbar-btn" id="btn-strike"       title="Strikethrough"      data-action="strike">        <s>S</s></button>
        <button class="toolbar-btn" id="btn-code"         title="Inline code"        data-action="code">          <code>`</code></button>
        <button class="toolbar-btn" id="btn-link"         title="Link (⌘K)"          data-action="link">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6.5 9.5a3.5 3.5 0 0 0 4.95 0l1.5-1.5a3.5 3.5 0 0 0-4.95-4.95l-.88.88" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <path d="M9.5 6.5a3.5 3.5 0 0 0-4.95 0L3.05 8a3.5 3.5 0 0 0 4.95 4.95l.88-.88" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="toolbar-separator" aria-hidden="true"></div>

      <!-- Heading levels -->
      <div class="toolbar-group toolbar-headings" role="group" aria-label="Heading level">
        <button class="toolbar-btn toolbar-btn--mono" data-action="h1" title="Heading 1 (⌘1)">H1</button>
        <button class="toolbar-btn toolbar-btn--mono" data-action="h2" title="Heading 2 (⌘2)">H2</button>
        <button class="toolbar-btn toolbar-btn--mono" data-action="h3" title="Heading 3 (⌘3)">H3</button>
      </div>

      <div class="toolbar-separator" aria-hidden="true"></div>

      <!-- Focus mode / theme toggles -->
      <button class="toolbar-btn" id="btn-focus"  title="Focus mode (⌘⇧F)" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.25"/>
          <path d="M2 2h3M2 2v3M14 2h-3M14 2v3M2 14h3M2 14v-3M14 14h-3M14 14v-3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="toolbar-btn" id="btn-theme"  title="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" id="icon-theme-sun">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.25"/>
          <line x1="8" y1="1.5" x2="8" y2="3"   stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="8" y1="13" x2="8" y2="14.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="1.5" y1="8" x2="3"  y2="8"  stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="13"  y1="8" x2="14.5" y2="8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="3.5" y1="3.5" x2="4.5" y2="4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="11.5" y1="11.5" x2="12.5" y2="12.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="11.5" y1="3.5" x2="12.5" y2="4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <line x1="3.5" y1="11.5" x2="4.5" y2="12.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" id="icon-theme-moon" style="display:none">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Word goal ring — replaced by wordgoal.js on Day 5 -->
      <div id="word-goal-ring" title="Word goal (⌘⇧G)" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle class="goal-track"    cx="11" cy="11" r="8" fill="none"/>
          <circle class="goal-progress" cx="11" cy="11" r="8" fill="none" id="goal-arc"/>
        </svg>
      </div>

    </div><!-- /#toolbar -->
  </div><!-- /#titlebar -->

  <!-- ── Tab bar ─────────────────────────────────────────────────────────── -->
  <div id="tabbar" role="tablist" aria-label="Open files">
    <!-- Tabs injected by tabs.js -->
    <button class="tab tab--active" role="tab" aria-selected="true" data-tab-id="default">
      <span class="tab-title">Untitled</span>
      <span class="tab-dot" aria-hidden="true"></span><!-- unsaved indicator -->
      <button class="tab-close" aria-label="Close tab" tabindex="-1">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <line x1="1.5" y1="1.5" x2="8.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8.5" y1="1.5" x2="1.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </button>

    <button id="btn-new-tab" class="tab-new" aria-label="New tab" title="New tab (⌘T)">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ── Main workspace ──────────────────────────────────────────────────── -->
  <div id="workspace">

    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside id="sidebar" aria-label="Sidebar" data-collapsed="true">
      <nav id="sidebar-nav" role="tablist" aria-label="Sidebar sections">
        <button class="sidebar-tab sidebar-tab--active" role="tab" data-section="files"  title="Files"  aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 2h6l4 4v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
            <path d="M9 2v4h4" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="sidebar-tab" role="tab" data-section="tags"  title="Tags" aria-selected="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 8.5 8.5 2H14v5.5L7.5 14 2 8.5Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
            <circle cx="11" cy="5" r="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="sidebar-tab" role="tab" data-section="toc"   title="Table of contents" aria-selected="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <line x1="3" y1="4"  x2="13" y2="4"  stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="7"  x2="13" y2="7"  stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="5" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            <line x1="3" y1="13" x2="13" y2="13" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </button>
      </nav>

      <div id="sidebar-content">
        <section class="sidebar-section" data-section="files">
          <p class="sidebar-empty">No folder open</p>
        </section>
        <section class="sidebar-section sidebar-section--hidden" data-section="tags">
          <p class="sidebar-empty">No tags yet</p>
        </section>
        <section class="sidebar-section sidebar-section--hidden" data-section="toc">
          <nav id="toc-nav" aria-label="Table of contents">
            <p class="sidebar-empty">Open a file to see its outline</p>
          </nav>
        </section>
      </div>

      <!-- Resize handle -->
      <div id="sidebar-resize" aria-hidden="true"></div>
    </aside>

    <!-- ── Editor pane ─────────────────────────────────────────────────── -->
    <main id="editor-pane" role="main">

      <!-- Empty state — shown when no file is open -->
      <div id="empty-state" aria-label="Welcome screen">
        <div class="empty-state-inner">
          <div class="empty-logo" aria-hidden="true">A</div>
          <h1 class="empty-title">Antigone</h1>
          <p class="empty-subtitle">A writing environment for long-form Markdown</p>
          <div class="empty-actions">
            <button class="empty-btn empty-btn--primary" id="btn-open-file">
              Open file
              <kbd>⌘O</kbd>
            </button>
            <button class="empty-btn" id="btn-new-file">
              New file
              <kbd>⌘N</kbd>
            </button>
          </div>
          <p class="empty-hint">Or drop a .md file anywhere in this window</p>
        </div>
      </div>

      <!-- CodeMirror 6 mount point — editor.js attaches here -->
      <div id="cm-editor" aria-label="Markdown editor"></div>

      <!-- Inline notifications (file changed, recovery available) -->
      <div id="notification-bar" role="alert" aria-live="assertive" hidden>
        <span id="notification-message"></span>
        <div id="notification-actions"></div>
        <button id="notification-dismiss" aria-label="Dismiss">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <line x1="1.5" y1="1.5" x2="10.5" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="10.5" y1="1.5" x2="1.5" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- ── Resize gutter between editor and preview ─────────────────────── -->
    <div id="split-resize" aria-hidden="true" title="Drag to resize"></div>

    <!-- ── Preview pane ────────────────────────────────────────────────── -->
    <aside id="preview-pane" aria-label="Markdown preview">
      <div id="preview-content" class="prose"></div>
    </aside>

  </div><!-- /#workspace -->

  <!-- ── Status bar ─────────────────────────────────────────────────────── -->
  <footer id="statusbar" role="status" aria-live="polite">
    <div class="status-left">
      <!-- Language indicator -->
      <span class="status-item" id="status-lang" title="File type">MD</span>
    </div>
    <div class="status-center">
      <!-- Word count / goal — populated by wordgoal.js -->
      <span class="status-item" id="status-words">0 words</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span class="status-item" id="status-readtime">0 min</span>
    </div>
    <div class="status-right">
      <!-- Cursor position -->
      <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <!-- Save indicator -->
      <span class="status-item status-save" id="status-save" data-state="saved">Saved ✓</span>
    </div>
  </footer>

  <!-- Focus mode overlay — dimmed class toggled by focus.js -->
  <div id="focus-overlay" aria-hidden="true" hidden></div>

</body>
</html>
